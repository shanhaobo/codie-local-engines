[project]
name = "codie-asr-funasr"
version = "0.1.0"
description = "Local ASR sidecar: FunASR (Paraformer-zh, torch) behind an OpenAI-compatible /v1/audio/transcriptions HTTP server, run natively on the host by the Bridge."
requires-python = ">=3.11"
dependencies = [
    "funasr>=1.1",
    "modelscope>=1.15",
    "torch>=2.2",
    "torchaudio>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "av>=12",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Symmetry with the other engine build scripts (`.[dev,mac]` / `.[dev,win]`).
mac = []
win = []
dev = [
    "pyinstaller>=6.0",
    "httpx>=0.26",
    "pytest>=8.0",
]

[project.scripts]
codie-asr-funasr = "codie_asr_funasr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codie_asr_funasr"]

[tool.ruff]
line-length = 100
target-version = "py311"
